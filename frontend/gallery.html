  <!-- Magnific Popup CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/magnific-popup.js/1.1.0/magnific-popup.min.css">

  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #f9f9f9, #dfe9f3);
      color: #333;
    }

    /* Masonry (zigzag) Layout */
    .gallery {
      column-count: 3;
      column-gap: 0; /* remove equal gaps for zigzag */
      padding: 20px;
      max-width: 1400px;
      margin: auto;
    }

    .gallery-link {
      display: inline-block;
      width: 100%;
      margin: 0;
      padding: 0;
      break-inside: avoid; /* important for masonry */
    }

    /* Card Style */
    .gallery-image {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      margin: 0 0 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.12);
      transition: transform 0.35s ease, box-shadow 0.35s ease;
    }

    .gallery-image:hover {
      transform: translateY(-8px) scale(1.03);
      box-shadow: 0 12px 30px rgba(0,0,0,0.2);
    }

    .gallery-image img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Glassmorphism Captions */
    .gallery-image figcaption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(6px);
      color: white;
      font-size: 14px;
      font-weight: 600;
      padding: 12px;
      text-align: center;
      opacity: 0;
      transform: translateY(100%);
      transition: all 0.3s ease;
    }

    .gallery-image:hover figcaption {
      opacity: 1;
      transform: translateY(0);
    }

    /* Magnific Popup Custom */
    .mfp-with-zoom .mfp-container,
    .mfp-with-zoom.mfp-bg {
      opacity: 0;
      transition: all 0.3s ease-out;
    }

    .mfp-with-zoom.mfp-ready .mfp-container { opacity: 1; }
    .mfp-with-zoom.mfp-ready.mfp-bg { opacity: 0.95; background: rgba(0,0,0,0.95); }
    .mfp-with-zoom.mfp-removing .mfp-container,
    .mfp-with-zoom.mfp-removing.mfp-bg { opacity: 0; }

    /* Neon Progress Bar */
    #progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 4px;
      background: linear-gradient(90deg, #ff00cc, #3333ff);
      width: 0%;
      z-index: 9999;
      transition: width 0.2s linear;
    }

    /* Image Counter */
    #counter {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
      z-index: 9999;
    }

    /* Play/Pause Button */
    #playPauseBtn {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: rgba(255,255,255,0.8);
      color: #333;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      z-index: 9999;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      transition: all 0.2s ease;
    }

    #playPauseBtn:hover {
      background: #ff00cc;
      color: white;
    }
  </style>
</head>

  <script>
  $(document).ready(function() {
    let autoplayInterval;
    let progressBar = $("#progress-bar");
    let counter = $("#counter");
    let playPauseBtn = $("#playPauseBtn");
    let totalItems = $(".gallery-link").length;
    let currentIndex = 0;
    let duration = 4000; // 4 seconds
    let isPlaying = true;

    function startProgress() {
      progressBar.css("width", "0%");
      progressBar.animate({ width: "100%" }, duration, "linear");
    }

    function updateCounter() {
      counter.text((currentIndex + 1) + " / " + totalItems);
    }

    $(".gallery-link").magnificPopup({
      type: "image",
      closeOnContentClick: true,
      closeBtnInside: false,
      mainClass: "mfp-with-zoom mfp-img-mobile",
      gallery: { enabled: true },
      image: {
        verticalFit: true,
        titleSrc: function(item) {
          return item.el.find("figcaption").text();
        }
      },
      callbacks: {
        open: function() {
          currentIndex = this.index;
          updateCounter();
          startAutoplay();
        },
        change: function() {
          currentIndex = this.index;
          updateCounter();
          startProgress();

          // 🌟 Fade + Slide Animation
          let img = this.content.find("img");
          img.css({ opacity: 0, transform: "translateX(30px)" });
          setTimeout(() => {
            img.css({ transition: "all 0.6s ease", opacity: 1, transform: "translateX(0)" });
          }, 50);
        },
        close: function() {
          clearInterval(autoplayInterval);
          progressBar.css("width", "0%");
        }
      }
    });

    function startAutoplay() {
      startProgress();
      autoplayInterval = setInterval(function() {
        if (isPlaying) {
          $.magnificPopup.instance.next();
          startProgress();
        }
      }, duration);
    }

    playPauseBtn.on("click", function() {
      isPlaying = !isPlaying;
      playPauseBtn.text(isPlaying ? "⏸ Pause" : "▶ Play");
      if (isPlaying) {
        startProgress();
      } else {
        progressBar.stop(true).css("width", "0%");
      }
    });
  });
</script>

</body>
</html>
